<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Магазины TamaLife</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #17212b);
            --text: var(--tg-theme-text-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #708499);
            --secondary: var(--tg-theme-secondary-bg-color, #232e3c);
            --btn: var(--tg-theme-button-color, #2ea6ff);
        }
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 90px; }
        
        .header { display: flex; justify-content: space-between; background: linear-gradient(135deg, #2ea6ff, #1a5e99); padding: 18px; border-radius: 20px; color: white; margin-bottom: 20px; }
        .balance { font-weight: bold; background: rgba(0,0,0,0.2); padding: 5px 12px; border-radius: 12px; }

        .shop-list { display: flex; flex-direction: column; gap: 15px; }
        .shop-item { background: var(--secondary); border-radius: 20px; overflow: hidden; border: 2px solid transparent; }
        .shop-header { display: flex; align-items: center; padding: 18px; cursor: pointer; }
        .shop-icon { width: 60px; height: 60px; margin-right: 15px; border-radius: 16px; background: rgba(255,255,255,0.1); overflow: hidden; }
        .shop-icon img { width: 100%; height: 100%; object-fit: contain; }
        .shop-info h3 { margin: 0 0 4px 0; font-size: 18px; font-weight: 800; }
        .shop-info p { margin: 0; font-size: 13px; color: var(--hint); }

        .enter-btn-container { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; padding: 0 18px; background: rgba(0,0,0,0.15); }
        .enter-btn-container.active { max-height: 100px; padding: 15px 18px; }
        .enter-btn { width: 100%; padding: 15px; border: none; border-radius: 14px; color: white; font-weight: bold; font-size: 16px; }

        .shop-screen { position: fixed; inset: 0; background: var(--bg); z-index: 100; padding: 15px; padding-bottom: 90px; overflow-y: auto; transform: translateY(100%); transition: transform 0.4s ease; }
        .shop-screen.active { transform: translateY(0); }
        .back-btn { background: var(--secondary); border: none; color: var(--text); padding: 12px 20px; border-radius: 14px; font-weight: bold; margin-bottom: 20px; }
        
        .items-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .card { background: var(--secondary); border-radius: 20px; padding: 15px; text-align: center; }
        .card img { width: 70px; height: 70px; object-fit: contain; }
        .card h3 { margin: 5px 0; font-size: 15px; }
        .price { font-weight: bold; color: #ffd700; margin: 10px 0; }
        .buy-btn { width: 100%; padding: 12px; border: none; border-radius: 12px; color: white; font-weight: bold; }

        .footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px; background: var(--bg); z-index: 300; }
        .close-btn { width: 100%; padding: 16px; border: none; border-radius: 14px; background: #ff3b30; color: white; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="main-screen">
        <div class="header">
            <h2>🏙 Город</h2>
            <div class="balance">🪙 <span id="coins-main">0</span></div>
        </div>
        <div class="shop-list" id="shop-list"></div>
    </div>

    <div id="shop-screen" class="shop-screen">
        <button class="back-btn" onclick="closeShop()">⬅️ Назад</button>
        <h2 id="shop-title" style="color:var(--text); margin-bottom:15px;"></h2>
        <div id="items-grid" class="items-grid"></div>
    </div>

    <div class="footer">
        <button class="close-btn" onclick="tg.close()">Закрыть магазин</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        let currentCoins = parseInt(urlParams.get('coins') || '0');
        document.getElementById('coins-main').innerText = currentCoins;

        const IMG_URL = "https://loodrize-sys.github.io/pvz-hastgame/img/";

        const SHOPS = {
            "tamaking": {
                name: "TamaKing", color: "#FF5722", img: IMG_URL + "logo_tamaking.png",
                items: [
                    { id: 'burger', name: 'Бургер', price: 25, img: IMG_URL + "burger.png" },
                    { id: 'fries', name: 'Картошка', price: 15, img: IMG_URL + "fries.png" }
                ]
            },
            "tamamart": {
                name: "TamaMart", color: "#4CAF50", img: IMG_URL + "logo_tamamart.png",
                items: [
                    { id: 'apple', name: 'Яблоко', price: 10, img: IMG_URL + "apple.png" },
                    { id: 'milk', name: 'Молоко', price: 15, img: IMG_URL + "milk.png" }
                ]
            },
            "tamapharm": {
                name: "TamaPharm", color: "#9C27B0", img: IMG_URL + "logo_tamapharm.png",
                items: [
                    { id: 'pill', name: 'Таблетка', price: 30, img: IMG_URL + "pill.png" }
                ]
            }
            // Добавь остальные магазины по аналогии
        };

        // Отрисовка списка
        const shopList = document.getElementById('shop-list');
        for (const [key, shop] of Object.entries(SHOPS)) {
            const div = document.createElement('div');
            div.className = 'shop-item';
            div.id = `shop-${key}`;
            div.innerHTML = `
                <div class="shop-header" onclick="toggleShop('${key}')">
                    <div class="shop-icon"><img src="${shop.img}"></div>
                    <div class="shop-info"><h3 style="color:${shop.color}">${shop.name}</h3></div>
                </div>
                <div class="enter-btn-container" id="enter-${key}">
                    <button class="enter-btn" style="background:${shop.color}" onclick="enterShop(event, '${key}')">Войти</button>
                </div>
            `;
            shopList.appendChild(div);
        }

        function toggleShop(key) {
            document.querySelectorAll('.enter-btn-container').forEach(el => el.classList.remove('active'));
            const el = document.getElementById(`enter-${key}`);
            el.classList.toggle('active');
        }

        function enterShop(event, key) {
            event.stopPropagation();
            const shop = SHOPS[key];
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('shop-screen').classList.add('active');
            document.getElementById('shop-title').innerText = shop.name;
            document.getElementById('shop-title').style.color = shop.color;

            const grid = document.getElementById('items-grid');
            grid.innerHTML = '';
            shop.items.forEach(item => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${item.img}">
                        <h3>${item.name}</h3>
                        <div class="price">🪙 ${item.price}</div>
                        <button class="buy-btn" style="background:${shop.color}" onclick="buyItem('${item.id}', ${item.price})">Купить</button>
                    </div>
                `;
            });
        }

        function closeShop() {
            document.getElementById('shop-screen').classList.remove('active');
            document.getElementById('main-screen').classList.remove('hidden');
        }

        // --- САМА ФУНКЦИЯ ПОКУПКИ ---
        function buyItem(itemId, price) {
            if (currentCoins < price) {
                tg.showAlert("Недостаточно монет!");
                return;
            }
            
            // Отправляем данные в бота
            tg.sendData(JSON.stringify({ 
                action: "buy_item", 
                item_id: itemId, 
                price: price 
            }));
            
            // Обновляем визуально баланс
            currentCoins -= price;
            document.getElementById('coins-main').innerText = currentCoins;
            
            // Показываем уведомление и закрываем окно, чтобы бот отреагировал
            tg.showAlert(`Вы купили ${itemId}!`, () => {
                tg.close(); // Закрываем WebApp
            });
        }
    </script>
</body>
</html>
