<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Магазины TamaLife</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #17212b);
            --text: var(--tg-theme-text-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #708499);
            --secondary: var(--tg-theme-secondary-bg-color, #232e3c);
            --btn: var(--tg-theme-button-color, #2ea6ff);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #2ea6ff, #1a5e99);
            padding: 18px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(46, 166, 255, 0.3);
            color: white;
        }
        .header h2 { margin: 0; font-size: 20px; }
        .balance { font-size: 18px; font-weight: bold; background: rgba(0,0,0,0.2); padding: 5px 12px; border-radius: 12px; }

        /* Список магазинов */
        .shop-list { display: flex; flex-direction: column; gap: 15px; }

        .shop-item {
            background: var(--secondary);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .shop-header {
            display: flex;
            align-items: center;
            padding: 18px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        
        .shop-header::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0.1;
            z-index: 0;
            transition: opacity 0.3s;
        }
        .shop-header:active { transform: scale(0.98); }

        .shop-icon {
            font-size: 34px;
            margin-right: 15px;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            position: relative;
            z-index: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            background: rgba(255,255,255,0.1);
            overflow: hidden;
        }
        
        .shop-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .shop-info { flex: 1; position: relative; z-index: 1; }
        .shop-info h3 { margin: 0 0 4px 0; font-size: 18px; font-weight: 800; }
        .shop-info p { margin: 0; font-size: 13px; color: var(--hint); }

        /* Выезжающая кнопка */
        .enter-btn-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), padding 0.4s ease;
            padding: 0 18px;
            background: rgba(0,0,0,0.15);
        }
        .enter-btn-container.active { max-height: 100px; padding: 15px 18px; }

        .enter-btn {
            width: 100%; padding: 15px; border: none; border-radius: 14px;
            background: var(--btn); color: white; font-weight: bold; font-size: 16px;
            cursor: pointer; transform: translateY(20px); opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .enter-btn-container.active .enter-btn { transform: translateY(0); opacity: 1; }

        /* Экран магазина */
        .shop-screen {
            position: fixed; inset: 0; background: var(--bg); z-index: 100;
            padding: 15px; padding-bottom: 90px; overflow-y: auto;
            transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .shop-screen.active { transform: translateY(0); }

        .back-btn {
            background: var(--secondary); border: none; color: var(--text);
            font-size: 15px; margin-bottom: 20px; cursor: pointer;
            padding: 12px 20px; border-radius: 14px; display: inline-flex;
            align-items: center; gap: 8px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Приветствие */
        .welcome-screen {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 60vh; text-align: center; animation: fadeIn 0.4s ease;
        }
        .welcome-icon { 
            font-size: 80px; margin-bottom: 20px; 
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
            width: 120px; height: 120px;
        }
        .welcome-icon img { width: 100%; height: 100%; object-fit: contain; }
        
        .welcome-title { font-size: 32px; font-weight: 900; margin-bottom: 10px; }
        .welcome-text { font-size: 16px; color: var(--hint); max-width: 85%; margin-bottom: 30px; }
        
        .loader {
            width: 40px; height: 40px; border: 4px solid var(--secondary);
            border-top: 4px solid var(--btn); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { 0% { transform: scale(0) rotate(-20deg); } 100% { transform: scale(1) rotate(0deg); } }

        /* Товары */
        .items-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
            animation: fadeIn 0.5s ease;
        }

        .card {
            background: var(--secondary); border-radius: 20px; padding: 15px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: transform 0.2s;
        }
        .card:active { transform: scale(0.97); }
        .card img { width: 70px; height: 70px; object-fit: contain; margin-bottom: 10px; }
        .card h3 { margin: 0; font-size: 15px; font-weight: bold; }
        .card p { margin: 5px 0; font-size: 12px; color: var(--hint); }
        .price { font-weight: 900; color: #ffd700; margin-bottom: 12px; font-size: 16px; }
        
        .buy-btn {
            width: 100%; padding: 12px; border: none; border-radius: 12px;
            background: var(--btn); color: white; font-weight: bold; cursor: pointer;
            font-size: 14px; transition: 0.2s;
        }
        .buy-btn:active { transform: scale(0.95); }

        .footer {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 15px; background: var(--bg);
            box-shadow: 0 -4px 15px rgba(0,0,0,0.3); z-index: 300;
        }
        .close-btn {
            width: 100%; padding: 16px; border: none; border-radius: 14px;
            background: rgba(255, 59, 48, 0.15); color: #ff3b30; font-weight: bold; font-size: 16px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="main-screen">
        <div class="header">
            <h2>🏙 Город</h2>
            <div class="balance">🪙 <span id="coins-main">0</span></div>
        </div>
        <div class="shop-list" id="shop-list"></div>
    </div>

    <div id="shop-screen" class="shop-screen">
        <button class="back-btn" onclick="closeShop()">⬅️ Назад</button>
        
        <div id="welcome-screen" class="welcome-screen">
            <div class="welcome-icon" id="welcome-icon"></div>
            <div class="welcome-title" id="welcome-title">Название</div>
            <div class="welcome-text" id="welcome-text">Описание</div>
            <div class="loader" id="loader"></div>
            <span style="color: var(--hint); font-size: 14px;">Загружаем ассортимент...</span>
        </div>

        <div id="items-grid" class="items-grid hidden"></div>
    </div>

    <div class="footer">
        <button class="close-btn" onclick="tg.close()">Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        let currentCoins = parseInt(urlParams.get('coins') || '0');
        document.getElementById('coins-main').innerText = currentCoins;

        // Базовый URL для картинок (замени, если папка называется иначе)
        const IMG_URL = "https://loodrize-sys.github.io/pvz-hastgame/img/";

        // --- БАЗА МАГАЗИНОВ ---
        const SHOPS = {
            "tamaking": {
                name: "TamaKing", desc: "Ресторан фастфуда", color: "#FF5722",
                img: IMG_URL + "logo_tamaking.png",
                welcome: "Добро пожаловать в TamaKing! Самые сочные бургеры для твоего питомца.",
                items: [
                    { id: 'burger', name: 'Бургер', price: 25, desc: '+30 Голод', img: IMG_URL + "burger.png" },
                    { id: 'fries', name: 'Картошка', price: 15, desc: '+15 Голод', img: IMG_URL + "fries.png" },
                    { id: 'cola', name: 'Кола', price: 10, desc: '+10 Счастье', img: IMG_URL + "cola.png" },
                    { id: 'nuggets', name: 'Наггетсы', price: 20, desc: '+20 Голод', img: IMG_URL + "nuggets.png" }
                ]
            },
            "tamakea": {
                name: "TamaKea", desc: "Магазин мебели", color: "#2196F3",
                img: IMG_URL + "logo_tamakea.png",
                welcome: "TamaKea — уютный дом начинается здесь! Выбери лучшую мебель.",
                items: [
                    { id: 'bed', name: 'Кровать', price: 100, desc: '+50 Энергия', img: IMG_URL + "bed.png" },
                    { id: 'chair', name: 'Кресло', price: 50, desc: '+15 Счастье', img: IMG_URL + "armchair.png" },
                    { id: 'wardrobe', name: 'Шкаф', price: 80, desc: '+10 Счастье', img: IMG_URL + "wardrobe.png" },
                    { id: 'lamp', name: 'Лампа', price: 30, desc: '+5 Счастье', img: IMG_URL + "lamp.png" }
                ]
            },
            "tamamart": {
                name: "TamaMart", desc: "Продуктовый магазин", color: "#4CAF50",
                img: IMG_URL + "logo_tamamart.png",
                welcome: "TamaMart! Свежие продукты каждый день. Что-нибудь для нашего малыша?",
                items: [
                    { id: 'apple', name: 'Яблоко', price: 10, desc: '+10 Голод', img: IMG_URL + "apple.png" },
                    { id: 'milk', name: 'Молоко', price: 15, desc: '+15 Голод', img: IMG_URL + "milk.png" },
                    { id: 'bread', name: 'Хлеб', price: 8, desc: '+8 Голод', img: IMG_URL + "bread.png" },
                    { id: 'cheese', name: 'Сыр', price: 20, desc: '+20 Голод', img: IMG_URL + "cheese.png" }
                ]
            },
            "tamabrew": {
                name: "TamaBrew", desc: "Бар", color: "#795548",
                img: IMG_URL + "logo_tamabrew.png",
                welcome: "TamaBrew — расслабься после тяжелого дня. Но питомцу только сок!",
                items: [
                    { id: 'juice', name: 'Сок', price: 15, desc: '+15 Счастье', img: IMG_URL + "juice.png" },
                    { id: 'peanuts', name: 'Орешки', price: 10, desc: '+5 Голод', img: IMG_URL + "peanuts.png" },
                    { id: 'smoothie', name: 'Смузи', price: 25, desc: '+25 Счастье', img: IMG_URL + "smoothie.png" }
                ]
            },
            "tamapharm": {
                name: "TamaPharm", desc: "Аптека", color: "#9C27B0",
                img: IMG_URL + "logo_tamapharm.png",
                welcome: "TamaPharm заботится о здоровье. Здесь есть всё для лечения.",
                items: [
                    { id: 'pill', name: 'Таблетка', price: 30, desc: '+30 Здоровье', img: IMG_URL + "pill.png" },
                    { id: 'bandage', name: 'Бинт', price: 20, desc: '+15 Здоровье', img: IMG_URL + "bandage.png" },
                    { id: 'syrup', name: 'Сироп', price: 50, desc: '+60 Здоровье', img: IMG_URL + "syrup.png" },
                    { id: 'vitamins', name: 'Витамины', price: 40, desc: '+40 Здоровье', img: IMG_URL + "vitamins.png" }
                ]
            },
            "tamacake": {
                name: "TamaCake", desc: "Кондитерская", color: "#E91E63",
                img: IMG_URL + "logo_tamacake.png",
                welcome: "TamaCake — самые сладкие десерты! Побалуй своего питомца.",
                items: [
                    { id: 'cake', name: 'Тортик', price: 25, desc: '+25 Счастье', img: IMG_URL + "cake.png" },
                    { id: 'cupcake', name: 'Кекс', price: 15, desc: '+15 Счастье', img: IMG_URL + "cupcake.png" },
                    { id: 'donut', name: 'Пончик', price: 20, desc: '+20 Счастье', img: IMG_URL + "donut.png" },
                    { id: 'cookie', name: 'Печенье', price: 12, desc: '+10 Счастье', img: IMG_URL + "cookie.png" }
                ]
            }
        };

        // --- ОТРИСОВКА СПИСКА ---
        const shopList = document.getElementById('shop-list');
        for (const [key, shop] of Object.entries(SHOPS)) {
            const item = document.createElement('div');
            item.className = 'shop-item';
            item.id = `shop-${key}`;
            item.innerHTML = `
                <div class="shop-header" onclick="toggleShop('${key}')" style="background: linear-gradient(90deg, ${shop.color}22 0%, transparent 100%);">
                    <div class="shop-icon">
                        <img src="${shop.img}" alt="${shop.name}">
                    </div>
                    <div class="shop-info">
                        <h3 style="color: ${shop.color};">${shop.name}</h3>
                        <p>${shop.desc}</p>
                    </div>
                </div>
                <div class="enter-btn-container" id="enter-${key}">
                    <button class="enter-btn" style="background: ${shop.color};" onclick="enterShop(event, '${key}')">
                        Войти внутрь →
                    </button>
                </div>
            `;
            shopList.appendChild(item);
        }

        function toggleShop(shopKey) {
            document.querySelectorAll('.enter-btn-container').forEach(el => {
                if (el.id !== `enter-${shopKey}`) el.classList.remove('active');
            });
            document.querySelectorAll('.shop-item').forEach(el => {
                if (el.id !== `shop-${shopKey}`) el.style.borderColor = 'transparent';
            });

            const container = document.getElementById(`enter-${shopKey}`);
            const shopItem = document.getElementById(`shop-${shopKey}`);
            const isActive = container.classList.toggle('active');
            
            if (isActive) {
                shopItem.style.borderColor = SHOPS[shopKey].color;
            } else {
                shopItem.style.borderColor = 'transparent';
            }
        }

        function enterShop(event, shopKey) {
            event.stopPropagation();
            const shop = SHOPS[shopKey];
            
            document.getElementById('main-screen').classList.add('hidden');
            const shopScreen = document.getElementById('shop-screen');
            shopScreen.classList.add('active');
            
            const welcomeScreen = document.getElementById('welcome-screen');
            const itemsGrid = document.getElementById('items-grid');
            welcomeScreen.classList.remove('hidden');
            itemsGrid.classList.add('hidden');
            
            const welcomeIcon = document.getElementById('welcome-icon');
            welcomeIcon.innerHTML = `<img src="${shop.img}" alt="${shop.name}">`;
            
            document.getElementById('welcome-title').innerText = shop.name;
            document.getElementById('welcome-title').style.color = shop.color;
            document.getElementById('welcome-text').innerText = shop.welcome;
            
            setTimeout(() => {
                welcomeScreen.classList.add('hidden');
                itemsGrid.classList.remove('hidden');
                
                itemsGrid.innerHTML = '';
                shop.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${item.img}" alt="${item.name}">
                        <h3>${item.name}</h3>
                        <p>${item.desc}</p>
                        <div class="price">🪙 ${item.price}</div>
                        <button class="buy-btn" style="background: ${shop.color};" onclick="buyItem('${item.id}', ${item.price})">Купить</button>
                    `;
                    itemsGrid.appendChild(card);
                });
            }, 1500);
        }

        function closeShop() {
            document.getElementById('shop-screen').classList.remove('active');
            document.getElementById('main-screen').classList.remove('hidden');
            document.querySelectorAll('.enter-btn-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.shop-item').forEach(el => el.style.borderColor = 'transparent');
        }

        function buyItem(itemId, price) {
            if (currentCoins < price) {
                tg.showAlert("Недостаточно монет!");
                return;
            }
            tg.sendData(JSON.stringify({ action: "buy_item", item_id: itemId, price: price }));
            currentCoins -= price;
            document.getElementById('coins-main').innerText = currentCoins;
            tg.showAlert(`Куплено! Остаток: ${currentCoins} 🪙`);
        }
    </script>
</body>
              </html>
